# config/graph_schema.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Neo4j Graph Loader — Canonical Graph Schema
#
# This file defines the complete graph model. Edit it to add new node labels,
# relationship types, properties, constraints, and indexes. All changes here
# are picked up automatically on the next pipeline start — no code changes
# required.
#
# Property types supported: string, integer, float, date, datetime
# Constraint types:         uniqueness, not_null
# Index types:              range, text
# ─────────────────────────────────────────────────────────────────────────────

loading:
  mode: stream                      # bulk | stream
  consumer_group_id: graph-loader   # Prefix of every group: <id>-<Label> (nodes), <id>-<type> (stream edges), <id>-<type>-<run> (bulk edges), <id>-retry-consumer
  max_poll_interval_ms: 300000      # Max ms between poll() calls before broker evicts consumer
  session_timeout_ms: 45000         # Kafka session timeout in milliseconds
  unwind_batch_size: 500             # Records per node write transaction (1-10000); also the edge outer batch, classic only
  flush_interval_ms: 1000            # Idle partial-batch flush interval (ms)
  retry_max_attempts: 3            # Includes the initial node-write attempt
  retry_base_delay_ms: 100          # Initial exponential retry delay (ms)
  retry_max_delay_ms: 5000          # Maximum exponential retry delay (ms)
  rejection_log_path: var/rejections/node-loader.jsonl  # File sink for malformed records of entities without dead_letter.enabled: true
  coordination:
    topic: graph.loader.coordination  # Deprecated Phase 4 clock topic, used only by --stream-clock-rotation; must not collide with data or DLQ topics;
                                       # reachable only via --stream-clock-rotation after P5-S1
    bucket_count: 64
    slot_duration_ms: 60000
    lease_timeout_ms: 120000
  bucket_lease:                        # P5-S1: bucket-lease coordinator tuning + P5-Q1 fencing
    health_check_interval_ms: 2000     # Streaming-only: supervisor poll interval for the lease server
    max_consecutive_restarts: 5        # Streaming-only: fail the run closed after this many restarts
    restart_count_reset_ms: 600000     # Streaming-only: a restarted server up this long after its quiet
                                        # period resets the restart count (deaths far apart never add up)
    restart_backoff_base_ms: 500       # Streaming-only: first restart-backoff delay
    restart_backoff_max_ms: 30000      # Streaming-only: capped restart-backoff delay
    reconnect_timeout_ms: 60000        # Streaming-only: bound on one lease-client reconnect (0 = unbounded, at the
                                        # risk of exceeding max_poll_interval_ms; must fit with tx_timeout_ms + Q)
    tx_timeout_ms: 30000               # T = lease duration and planned-writer tx timeout; leased writes get at most T-4 s (fenced BEGIN)
                                        # must be >= 6000 in lease modes and >= 10x
                                        # expected_chunk_commit_ms
    expected_chunk_commit_ms: 1000     # Operator estimate of a typical chunk's commit time
    restart_quiet_margin_ms: 5000      # Margin added to T for the post-restart quiet period Q
                                        # (>= 2000: Neo4j's tx-monitor check interval)
  slot_buffer_max_records: 10000       # Clock path only (--stream-clock-rotation): bounded unleased relationship records per loader
  slot_worker_queue_max_batches: 32    # Bounded handoff from Kafka poller to Neo4j worker

nodes:

  - label: Person                   # Neo4j node label
    topic: person-events            # Kafka topic carrying Person records
    key_property: personId          # Unique identifier — must match a property name below

    properties:

      personId:
        type: string                # Scalar type for this property
        required: true              # Record is rejected if this field is absent
        constraint:
          type: uniqueness          # → CREATE CONSTRAINT person_personid_unique IF NOT EXISTS
                                    #     FOR (n:Person) REQUIRE n.personId IS UNIQUE

      name:
        type: string
        required: true
        constraint:
          type: not_null            # → CREATE CONSTRAINT person_name_not_null IF NOT EXISTS
                                    #     FOR (n:Person) REQUIRE n.name IS NOT NULL
        index:
          type: text                # → CREATE TEXT INDEX person_name_text IF NOT EXISTS
                                    #     FOR (n:Person) ON (n.name)

      age:
        type: integer               # 64-bit integer in Neo4j
        required: false
        index:
          type: range               # → CREATE RANGE INDEX person_age_range IF NOT EXISTS
                                    #     FOR (n:Person) ON (n.age)

      salary:
        type: float                 # IEEE 754 double in Neo4j
        required: false             # Optional — no constraint or index on this field

      birthDate:
        type: date                  # Neo4j Date (YYYY-MM-DD)
        required: false

      lastLogin:
        type: datetime              # Neo4j DateTime (ISO-8601 with timezone)
        required: false

    # dead_letter:                  # Optional — opt into DLQ routing for malformed
    #   enabled: true                #   Person records (Phase 5 Slice 2). Omitted here
    #   # topic: dlq-person          #   on purpose: this label still uses the file
    #                                #   rejection sink (rejection_log_path above),
    #                                #   which is the zero-behavior-change default.
    #                                #   `topic` is optional: when omitted, the
    #                                #   effective DLQ topic defaults to
    #                                #   "<this label's topic>.dlq".

  - label: Company
    topic: company-events
    key_property: companyId

    properties:

      companyId:
        type: string
        required: true
        constraint:
          type: uniqueness          # → CREATE CONSTRAINT company_companyid_unique IF NOT EXISTS
                                    #     FOR (n:Company) REQUIRE n.companyId IS UNIQUE

      name:
        type: string
        required: true
        constraint:
          type: not_null            # → CREATE CONSTRAINT company_name_not_null IF NOT EXISTS
                                    #     FOR (n:Company) REQUIRE n.name IS NOT NULL
        index:
          type: text                # → CREATE TEXT INDEX company_name_text IF NOT EXISTS
                                    #     FOR (n:Company) ON (n.name)

      foundedYear:
        type: integer
        required: false
        index:
          type: range               # → CREATE RANGE INDEX company_foundedyear_range IF NOT EXISTS
                                    #     FOR (n:Company) ON (n.foundedYear)

edges:

  - type: WORKS_AT                  # Neo4j relationship type
    topic: works-at-events          # Kafka topic carrying WORKS_AT records
    nodes:
      source: Person                # Source node label
      target: Company               # Target node label — different from source (not self-referencing)
    source_key_property: personId
    target_key_property: companyId
    execution:
      mode: python_apoc
      worker_count: 1

    properties:

      since:
        type: date                  # When the employment began
        required: true
        constraint:
          type: not_null            # → CREATE CONSTRAINT works_at_since_not_null IF NOT EXISTS

      role:
        type: string                # Job title or role description
        required: false             # Optional — some records may omit this

    mix_and_batch:
      lane_count: 1                 # Deterministic directional source-hash lanes
      batch_size: 1000              # Edges written per Neo4j transaction
      forward_slot_ms: 500          # Time slot for forward edges (src_id < tgt_id)
      backward_slot_ms: 500         # Time slot for backward edges (src_id > tgt_id)

    retry:
      max_attempts: 3               # Total attempts including the first
      base_delay_seconds: 1.0       # Initial backoff delay
      max_delay_seconds: 60.0       # Backoff ceiling — must be >= base_delay_seconds

    # order_by: since                # Phase 5 Slice 4: alternative to pair-parking.
    #   When set, retried and live writes use a conditional SET that only
    #   applies when the incoming value is newer than what's stored, so a
    #   stale retry can never clobber a newer commit. Must name a declared
    #   property. Off here on purpose: WORKS_AT uses the default pair-parking
    #   behavior instead.

    dead_letter:
      # Phase 5 Slice 2: this block used to be dead code (no loader read it);
      # it is now live. Kept `enabled: false` here on purpose so this
      # repository's own default schema keeps its pre-slice behavior
      # (malformed WORKS_AT records keep going to rejection_log_path) with
      # zero silent change. Flip to `true` to route them to the `topic`
      # below instead (created automatically with unlimited retention).
      # `topic` is optional; when omitted the effective topic defaults to
      # "<this type's topic>.dlq".
      topic: dlq-works-at           # Kafka DLQ topic for malformed records
      enabled: false                # Set true to route malformed records here instead of the file
      # route_missing_endpoints_in_bulk: true  # Phase 5 Slice 3: bulk-only opt-in.
      #   Streaming always DLQs a missing/ambiguous endpoint when enabled: true
      #   above; classic/lease BULK stays fail-closed (whole batch fails) unless
      #   this is also set true. Requires enabled: true. Off here on purpose.
      # max_retry_attempts: 5        # Phase 5 Slice 4: how many times the retry
      #   consumer re-attempts a DLQ'd missing/ambiguous-endpoint (or write_failed) row before
      #   parking it (default 5, 1-1000). Requires enabled: true.
      # parked_topic: dlq-works-at-parked  # Phase 5 Slice 4: parking-lot topic
      #   override. Omitted here on purpose: the effective topic defaults to
      #   "<this type's resolved DLQ topic>.parked". Requires enabled: true.

  - type: KNOWS
    topic: knows-events
    nodes:
      source: Person
      target: Person                # Same as source → self-referencing edge
                                    # Isolated only in classic bulk with --bulk-edge-overlap labels
                                    # (and the clock path); planned, lease and stream
                                    # run it together with the other types

    properties:

      since:
        type: date
        required: true
        constraint:
          type: not_null            # → CREATE CONSTRAINT knows_since_not_null IF NOT EXISTS

      strength:
        type: float                 # Relationship weight, e.g. 0.0–1.0
        required: false

    mix_and_batch:
      lane_count: 1
      batch_size: 500               # Smaller batch for self-referencing edges (higher lock contention; applies to classic only)
      forward_slot_ms: 500
      backward_slot_ms: 500

    retry:
      max_attempts: 5               # More retries for self-referencing edges (higher contention; classic only)
      base_delay_seconds: 2.0
      max_delay_seconds: 120.0      # Longer ceiling to absorb Neo4j lock storms (classic only)

    dead_letter:
      # Same Phase 5 Slice 2 note as WORKS_AT above: kept `enabled: false`
      # so this repository's default schema has zero silent behavior change.
      topic: dlq-knows
      enabled: false                # Set true to route malformed records here instead of the file
    source_key_property: personId
    target_key_property: personId
    execution:
      mode: python_apoc
      worker_count: 1
