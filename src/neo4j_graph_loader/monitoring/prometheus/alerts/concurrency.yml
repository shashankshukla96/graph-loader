# STARTING POINT, NOT AN SLO. Thresholds below are conservative defaults
# chosen without production traffic data.
# Tune every threshold to your own environment before treating a firing
# alert as an incident. `for:` durations are chosen to avoid a scrape-
# interval blip firing an alert, not to model any real SLO.
groups:
  - name: graph-loader-concurrency
    rules:
      - alert: GraphLoaderPlannedModeDeadlockObserved
        # Review finding (Story 2 nit): a bulk planned-writer container's
        # lifetime is ~60s; once it exits, its series goes stale and a
        # plain instant comparison resolves this critical alert within
        # ~5m even though the deadlock genuinely happened and still
        # deserves investigation. max_over_time keeps it visible for an
        # hour after the fact. The selector names no identity label, so the
        # evidence also survives the exporter (unique per incarnation) leaving:
        # max_over_time keeps the series by its labels, stale or not.
        expr: max_over_time(graph_loader_deadlocks_recovered_total{kind="planned-writer"}[1h]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Planned-mode writer recovered a deadlock — this must stay 0 by construction (docs/USAGE.md §6/§9); investigate the resource-disjointness invariant immediately."
      - alert: GraphLoaderLeaseWaitersStuck
        expr: graph_loader_lease_waiters > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} waiter(s) parked on the bucket-lease server for over 2m — sustained contention; a writer may be starved (real starvation is more reliably signaled by GraphLoaderLeaseWaitTimeoutsDetected)."
      - alert: GraphLoaderLeaseWaitTimeoutsDetected
        expr: increase(graph_loader_lease_wait_timeouts_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} lease wait timeout(s) in 10m — a writer aborted its transaction per P5-Q1's disconnect-safety contract; check for lease-server restart or contention."
      - alert: GraphLoaderPlanResourceWaitHigh
        # Review finding (Story 2, should-fix 4): sum by (le) alone merges
        # every concurrent run's planned-dispatcher into one p95 — one
        # run's contention can hide behind, or pollute, another's. kind
        # adds nothing here (only planned-dispatcher emits this metric);
        # execution_id (a METRIC label since E15: one value per
        # `graph-loader start`, always set) is the dimension that distinguishes
        # runs. run_id is reusable (two executions may share one) and is
        # empty on the roles Docker never gave it, so it is no grouping key.
        # An idle dispatcher has rate 0 across the window, so the quantile
        # is NaN and `NaN > 5` is false — no false positive from idleness.
        expr: histogram_quantile(0.95, sum by (le, execution_id) (rate(graph_loader_plan_resource_wait_seconds_bucket[5m]))) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Planned-dispatcher execution {{ $labels.execution_id }} p95 resource wait exceeded 5s over 5m."
