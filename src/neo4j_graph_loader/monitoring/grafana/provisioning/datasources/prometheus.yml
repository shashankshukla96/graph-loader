apiVersion: 1
datasources:
  - name: Prometheus
    # Explicit uid, referenced verbatim by the dashboard JSON's
    # panel/template-variable datasource refs (reviewer nit: relying on
    # an implicit default + a hidden datasource-typed template variable
    # is fragile — pin it here instead).
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Matches prometheus.yml's own scrape_interval so Grafana's step
      # calculation and any future $__rate_interval usage line up with
      # how often new samples actually arrive.
      timeInterval: "3s"
