# Node schema used by publish_and_load_nodes.py. The relationship declarations
# model all relationships emitted by build_subset.py, but are not loaded until
# the Phase 3 edge writer exists.
loading:
  mode: bulk
  consumer_group_id: imdb-example
  unwind_batch_size: 500
  flush_interval_ms: 1000
  rejection_log_path: var/rejections/imdb-node-loader.jsonl

nodes:
  - label: Title
    topic: imdb-title
    key_property: tconst
    properties:
      tconst: {type: string, required: true, constraint: {type: uniqueness}}
      title_type: {type: string, required: true}
      primary_title: {type: string, required: true}
      original_title: {type: string, required: false}
      is_adult: {type: integer, required: true}
      start_year: {type: integer, required: false}
      end_year: {type: integer, required: false}
      runtime_minutes: {type: integer, required: false}
  - label: Person
    topic: imdb-person
    key_property: nconst
    properties:
      nconst: {type: string, required: true, constraint: {type: uniqueness}}
      # Compatible with the existing local :Person non-null name constraint.
      name: {type: string, required: true}
      primary_name: {type: string, required: true}
      birth_year: {type: integer, required: false}
      death_year: {type: integer, required: false}
  - label: Genre
    topic: imdb-genre
    key_property: name
    properties: {name: {type: string, required: true, constraint: {type: uniqueness}}}
  - label: Profession
    topic: imdb-profession
    key_property: name
    properties: {name: {type: string, required: true, constraint: {type: uniqueness}}}
  - label: Character
    topic: imdb-character
    key_property: name
    properties: {name: {type: string, required: true, constraint: {type: uniqueness}}}
  - label: TitleType
    topic: imdb-title-type
    key_property: name
    properties: {name: {type: string, required: true, constraint: {type: uniqueness}}}
  - label: Region
    topic: imdb-region
    key_property: code
    properties: {code: {type: string, required: true, constraint: {type: uniqueness}}}
  - label: Language
    topic: imdb-language
    key_property: code
    properties: {code: {type: string, required: true, constraint: {type: uniqueness}}}
  - label: AlternativeTitle
    topic: imdb-alternative-title
    key_property: aka_id
    properties:
      aka_id: {type: string, required: true, constraint: {type: uniqueness}}
      title_id: {type: string, required: true}
      ordering: {type: integer, required: true}
      title: {type: string, required: true}
      is_original_title: {type: integer, required: true}
  - label: Rating
    topic: imdb-rating
    key_property: rating_id
    properties:
      rating_id: {type: string, required: true, constraint: {type: uniqueness}}
      title_id: {type: string, required: true}
      average_rating: {type: float, required: true}
      num_votes: {type: integer, required: true}

edges:
  - {type: HAS_GENRE, topic: imdb-has-genre, nodes: {source: Title, target: Genre}, properties: {title_id: {type: string, required: true}}}
  - {type: HAS_TITLE_TYPE, topic: imdb-has-title-type, nodes: {source: Title, target: TitleType}, properties: {title_id: {type: string, required: true}}}
  - {type: HAS_PROFESSION, topic: imdb-has-profession, nodes: {source: Person, target: Profession}, properties: {person_id: {type: string, required: true}}}
  - {type: KNOWN_FOR, topic: imdb-known-for, nodes: {source: Person, target: Title}, properties: {person_id: {type: string, required: true}}}
  - {type: CREDITED_ON, topic: imdb-credited-on, nodes: {source: Person, target: Title}, properties: {category: {type: string, required: true}}}
  - {type: ACTED_IN, topic: imdb-acted-in, nodes: {source: Person, target: Title}, properties: {category: {type: string, required: true}}}
  - {type: PLAYED, topic: imdb-played, nodes: {source: Person, target: Character}, properties: {title_id: {type: string, required: true}}}
  - {type: DIRECTED, topic: imdb-directed, nodes: {source: Person, target: Title}, properties: {person_id: {type: string, required: true}}}
  - {type: WROTE, topic: imdb-wrote, nodes: {source: Person, target: Title}, properties: {person_id: {type: string, required: true}}}
  - {type: EPISODE_OF, topic: imdb-episode-of, nodes: {source: Title, target: Title}, properties: {episode_id: {type: string, required: true}}}
  - {type: HAS_ALTERNATIVE_TITLE, topic: imdb-has-alternative-title, nodes: {source: Title, target: AlternativeTitle}, properties: {aka_id: {type: string, required: true}}}
  - {type: AVAILABLE_IN_REGION, topic: imdb-available-in-region, nodes: {source: AlternativeTitle, target: Region}, properties: {aka_id: {type: string, required: true}}}
  - {type: IN_LANGUAGE, topic: imdb-in-language, nodes: {source: AlternativeTitle, target: Language}, properties: {aka_id: {type: string, required: true}}}
  - {type: HAS_RATING, topic: imdb-has-rating, nodes: {source: Title, target: Rating}, properties: {rating_id: {type: string, required: true}}}
